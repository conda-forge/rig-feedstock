context:
  version: "0.10.0"

package:
  name: rig
  version: ${{ version }}

source:
  url: https://github.com/r-lib/rig/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 09f020effe1e0a6bbdf57b17e5f8e1b9d5536f53bcd9de55d54aa6b2fec109f1

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # copy shell completion files
      - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
      - let out_dir = glob target/*/release/build/rig-*/out | first
      - cp ($out_dir)/rig.bash ($prefix)/share/bash-completion/completions/rig
      - cp ($out_dir)/rig.fish ($prefix)/share/fish/vendor_completions.d/rig.fish
      - cp ($out_dir)/_rig     ($prefix)/share/zsh/site-functions/_rig

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - rig --help
      - rig --version
  - package_contents:
      bin:
        - rig
        - rig-shim
      files:
        - if: unix
          then:
            - share/bash-completion/completions/rig
            - share/fish/vendor_completions.d/rig.fish
            - share/zsh/site-functions/_rig
        - if: win
          then:
            - Library/share/bash-completion/completions/rig
            - Library/share/fish/vendor_completions.d/rig.fish
            - Library/share/zsh/site-functions/_rig
      strict: true

about:
  summary: The R Installation Manager
  description: |
    rig is a CLI to install, remove, configure, and switch between multiple
    versions of R. It works on macOS, Windows and Linux, supports symbolic
    version names (e.g. `release`, `devel`, `oldrel`), lets you run multiple
    R versions in parallel via quick links, and integrates with the
    RStudio and Positron IDEs.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://rig.r-lib.org
  repository: https://github.com/r-lib/rig

extra:
  recipe-maintainers:
    - salim-b
